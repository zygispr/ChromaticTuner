name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The six quality gates from quickstart.md. All must pass to merge —
  # Constitution v2.0.0, Development Workflow & Quality Gates.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # 22, not 20, and this is not a routine bump: on Node 20 **no job in this
      # workflow ran at all**. `packageManager` pins pnpm 11.18.0, which requires
      # Node >= 22.13, so `actions/setup-node`'s own `cache: pnpm` step invoked
      # `pnpm store path` under Node 20 and died with
      # `ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite` — before checkout's install,
      # before a single gate. Found by 004's T050, which exists because 003's
      # T052 found `pnpm build` listed as a gate since 001 and never wired into
      # this file. The same class of defect, one level further down.
      #
      # 22 rather than 24 deliberately: research D1 justifies the listing gate
      # being `.mjs` with JSON data by CI predating TypeScript type stripping,
      # and Node 22 still does — it is behind `--experimental-strip-types` until
      # 23.6. Moving to 24 would quietly invalidate a recorded decision.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (zero warnings — Principle I)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (must finish under 60s — Principle III)
        run: pnpm test

      - name: Coverage (packages/core >= 90%)
        run: pnpm test:coverage

      # quickstart.md has listed `pnpm build` among the gates that must pass on
      # every PR since 001, but it was never actually wired into this workflow —
      # so a change that broke the production build passed CI. Found by 003's
      # T052 while checking that its own new gate ran here.
      - name: Build
        run: pnpm build

      # The guarantees no browser can observe (contract P12, P12a; V-ENV-2):
      # robots.txt and sitemap.xml correct for the canonical origin AND
      # disallow-all for any other, no unresolved %VITE_*% tokens in any emitted
      # file, and crawler-only files kept out of the service worker's precache.
      #
      # The script drives its own builds, including a non-canonical one — that
      # branch runs only on preview deployments, which is exactly why it would
      # otherwise be the branch nobody notices is broken.
      - name: Build output (crawl directives, precache exclusion)
        run: pnpm --filter @chromatic-tuner/web verify:build-output

      # The store listing's own gate (004, contract L1–L12): field presence and
      # limits, the out-of-scope vocabulary, asset dimensions, and the agreement
      # between the two listings and the web page.
      #
      # It runs after Build deliberately — L7 compares the listing against the
      # rendered text of dist/index.html, not against the constant that produces
      # it, because comparing two references to one constant passes whatever the
      # page actually says.
      - name: Listing (fields, claims, assets, identity)
        run: pnpm verify:listing

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Mobile tests (jest-expo)
        run: pnpm --filter @chromatic-tuner/mobile test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @chromatic-tuner/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
