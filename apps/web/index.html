<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      A raster, and not `icon.svg` (008 — FR-176, research D6). Safari on iOS and
      iPadOS does not accept SVG here and does not say so: it adds a screenshot
      of the page to the home screen instead. SVG stays correct for `rel="icon"`
      above, which is why the rule this pair is checked against is per-`rel`.

      Three separate things about this file are deliberate, and all three look
      right in a file browser if got wrong: it is a PNG, it is opaque (iOS fills
      transparency with solid black), and it is SQUARE — `icon.svg` is generated
      pre-rounded for a favicon, and iOS applies its own superellipse, so a
      rounded source is cut twice and the wallpaper shows at four corners.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      The title, description, canonical address, token stylesheet, and the whole
      supporting content section are injected by `siteIdentity()` in
      vite.config.ts, from `src/content.ts`.

      Deliberately not written here as well. Each of those strings is consumed
      more than once — as the page's own copy, as its preview identity, and as
      its machine-readable description — and a value written into markup here
      and into the plugin there is a value that will disagree with itself inside
      two releases. Answer engines now cross-check schema claims against visible
      page text and discount the page when the two differ (research D6), so
      keeping one source is a correctness property rather than tidiness.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
